<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ping hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<!-- iOS ignores the web manifest for home-screen installs: without these four
     Safari gives a browser-chrome tab with a screenshot for an icon, and the
     standalone app frame never appears. Android reads the manifest and never
     needed them, which is why their absence went unnoticed. -->
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ping Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#201b15">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* warm, low-blue, solid — Chris is eye-strain sensitive */
  :root {
    --bg: #201b15; --panel: #2a241c; --panel2: #332c22; --line: #4a4033;
    --text: #e8ddcb; --dim: #a89880; --accent: #e0a458; --accent2: #b8834a;
    --in: #3a3226; --out: #2e3a2e; --peer: #33302a; --dead: #6b5f4e;
  }
  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; height: 100vh;
         height: 100dvh; /* phones: 100vh overflows past the URL bar and sinks
                            the compose bar below the fold */
         display: flex; overflow: hidden;
         touch-action: pan-x pan-y; }  /* fingers scroll, never pinch-zoom */
  #side { width: 340px; min-width: 220px; max-width: 640px; background: var(--panel);
          display: flex; flex-direction: column; flex-shrink: 0; }
  #divider { width: 6px; cursor: col-resize; background: var(--line);
             flex-shrink: 0; }
  #divider:hover, #divider.dragging { background: var(--accent2); }
  #tabs { display: flex; }
  #tabs button { flex: 1; padding: 12px 0; background: none; border: none;
                 color: var(--dim); font-size: 15px; cursor: pointer;
                 border-bottom: 2px solid transparent; }
  #tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #tabs #spawn { flex: 0 0 44px; font-size: 18px; color: var(--accent); }
  #escbadge:not(:empty) { background: var(--accent); color: #1d1812;
    border-radius: 9px; padding: 0 7px; margin-left: 6px; font-size: 12px;
    font-weight: 700; }
  /* escalation decision cards */
  .card { background: var(--panel); border: 1px solid var(--accent2);
          border-radius: 10px; padding: 12px 14px; margin: 10px 14px; }
  .card.answered { border-color: var(--line); opacity: 0.6; }
  .card .topic { display: inline-block; background: var(--in);
          border-radius: 5px; padding: 1px 8px; color: var(--accent);
          font-size: 13px; margin-bottom: 6px; }
  .card .q { font-size: 15px; margin: 4px 0 8px; }
  .card .meta { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
  .card .reply { display: flex; gap: 8px; }
  .card .reply input { flex: 1; background: var(--panel2);
          border: 1px solid var(--line); color: var(--text);
          border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .card .reply button { background: var(--accent2); border: none;
          color: #1d1812; border-radius: 8px; padding: 0 16px; cursor: pointer; }
  .card .answer { background: var(--out); border-radius: 8px;
          padding: 8px 10px; font-size: 14px; }
  #esc-list { flex: 1; overflow-y: auto; display: none; }
  #threads { overflow-y: auto; flex: 1; }
  .th { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .th:hover { background: var(--panel2); }
  .th.sel { background: var(--panel2); border-left: 3px solid var(--accent); }
  .th.gray { opacity: 0.45; }
  /* a fault, not a quiet session: never gray, which reads as "nothing wrong" */
  .th.down { opacity: 1; background: var(--panel2); border-left: 3px solid var(--accent); }
  .th .name { font-weight: 600; font-size: 16px; }
  .th .name .badge, #hinfo .hname .badge { margin-left: 12px; }
  .th .edit { color: var(--dim); font-size: 13px; margin-left: 8px;
              cursor: pointer; opacity: 0; }
  .th:hover .edit { opacity: 1; }
  .th .edit:hover { color: var(--accent); }
  .th .badges { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
  .th.dragging { opacity: 0.4; }
  .th.dragover { box-shadow: inset 0 2px 0 var(--accent); }
  #filter { width: 100%; box-sizing: border-box; background: var(--in); border: none;
    border-bottom: 1px solid var(--line); color: var(--text); padding: 8px 14px;
    font-size: 14px; outline: none; }
  #filter::placeholder { color: var(--dim); }
  .th .meta { color: var(--dim); font-size: 13px; display: flex; gap: 8px; }
  .th .meta.label { color: var(--accent); opacity: 0.9; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; display: block; }
  .badge.model { color: #c9b89f; border-color: #786b5a; }
  .badge { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px;
           font-size: 12px; color: var(--dim); white-space: nowrap;
           display: inline-block; }
  .badge.watch { color: #9dc183; border-color: #9dc183; }
  .badge.act { color: #1d1812; background: #9dc183; border-color: #9dc183;
               font-weight: 700; }
  .badge.escb { color: #1d1812; background: var(--accent); border-color: var(--accent);
                font-weight: 700; }
  .th .preview { color: var(--dim); font-size: 13px; margin-top: 3px;
                 display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; }
  .th .preview b { color: var(--text); opacity: 0.8; font-weight: 600; }
  /* plumbing, not a session: reads quieter than a dead card, and deliberately
     exempt from the gray "gone quiet" treatment that invites worry */
  .reprow { display: flex; gap: 6px; align-items: center; margin: 5px 0; }
  .reprow input[type=text], .reprow .rfrom, .reprow .rto {
    flex: 1 1 0; min-width: 0; background: var(--panel2);
    border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font-size: 14px; }
  .reprow .arrow { color: var(--dim); flex: 0 0 auto; }
  .reprow .rdel { background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; padding: 4px 9px; cursor: pointer; flex: 0 0 auto; }
  .reprow .rdel:hover { color: var(--accent); border-color: var(--accent); }
  .repadd { background: var(--panel2); border: 1px solid var(--line);
    color: var(--accent); border-radius: 6px; padding: 7px 12px;
    cursor: pointer; font-size: 14px; margin-top: 6px; }
  /* accordion: the disclosure is a real thumb target, not a glyph you have to
     aim at -- 412px is a first-class surface */
  .disc { display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px;
    text-align: center; color: var(--accent); cursor: pointer; user-select: none;
    margin-right: 2px; }
  .th.kid { padding-left: 26px; border-left: 2px solid var(--line); }
  /* (c): the three interactive badges leave the tag flow into their own row.
     Tried as CSS only first -- margin-left:auto inside the same flex-wrap
     container does not right-align a cluster, it forces a line break before
     it, so the card got TALLER (measured 166 -> 139 vs 126 for tags-only).
     A sibling container is what actually removes the row. */
  .rowctl { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px; }
  .repbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .repbtns .repadd { margin-top: 0; }
  .cmdrow .have { color: var(--dim); font-size: 12px; flex: 0 0 auto; }
  .cmdrow .box { width: 16px; height: 16px; flex: 0 0 auto;
    accent-color: var(--accent2); pointer-events: none; }
  #modal .hint { color: var(--dim); font-size: 13px; margin: 2px 0 8px; }
  .badge.ghostb { color: var(--dim); border-color: var(--line);
                  border-style: dashed; }
  .th.ghost .name { opacity: 0.72; }
  .th.ghost .meta, .th.ghost .badges { opacity: 0.6; }
  .badge.squad { color: var(--accent); border-color: var(--accent2); }
  .badge.proj { color: #a3c9c7; border-color: #5a7877; }
  .badge.chld { color: #c9a2d0; border-color: #7a5f80; }
  .badge.orch { color: #e0b56a; border-color: #8a6d3f; }
  .badge.boot { color: #1d1812; background: var(--accent2); border-color: var(--accent2);
    cursor: pointer; font-weight: 600; }
  .badge.unhide { color: var(--accent); border-color: var(--accent); cursor: pointer; }
  .hiddenhead { padding: 10px 14px; color: var(--dim); font-size: 13px;
    cursor: pointer; border-bottom: 1px solid var(--line); user-select: none; }
  .hiddenhead:hover { color: var(--text); }
  .th .sweep { color: var(--dim); font-size: 13px; margin-left: 6px; cursor: pointer;
    opacity: 0; float: right; }
  .th:hover .sweep { opacity: 1; }
  .th .sweep:hover { color: var(--accent); }
  .escblk { border: 1px solid var(--line); border-radius: 10px; margin: 10px 12px;
    overflow: hidden; }
  .escblk .bhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    cursor: pointer; background: var(--panel2); user-select: none; }
  .escblk .bhead .cnt { margin-left: auto; color: var(--dim); font-size: 12px; }
  .escblk .card { margin: 8px; }
  .card .chead { display: flex; align-items: center; gap: 8px; cursor: pointer;
    flex-wrap: wrap; }
  .card .chead .num { color: var(--dim); font-size: 12px; }
  .card .chead .meta { margin: 0 0 0 auto; }
  .chev { color: var(--dim); width: 14px; display: inline-block; }
  .escfbar { margin: 10px 12px 0; padding: 8px 12px; border: 1px dashed var(--accent2);
    border-radius: 8px; color: var(--dim); cursor: pointer; font-size: 13px; }
  #resp-acc { margin: 4px 12px 8px; }
  #resp-acc .rhead { color: var(--dim); font-size: 12px; cursor: pointer;
    padding: 6px 0; user-select: none; }
  #resp-acc .rhead:hover { color: var(--text); }
  #resp-acc .rrow { color: var(--dim); font-size: 13px; border-left: 2px solid var(--line);
    padding: 6px 10px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #resp-acc .rmore { color: var(--accent); cursor: pointer; white-space: nowrap; }
  .badge.chan { cursor: pointer; }
  .badge.voice { cursor: pointer; }
  .badge.rowmic { cursor: pointer; }
  .badge.rowmic:hover { color: var(--accent); border-color: var(--accent); }
  .badge.voice.von { color: #1d1812; background: #9dc183; border-color: #9dc183;
                     font-weight: 700; }
  .badge.chan:hover { color: var(--accent); border-color: var(--accent); }
  /* in-UI popover — replaces every browser prompt()/alert(); solid bg for
     eye comfort, closes on outside click or Esc */
  #pop { position: fixed; z-index: 40; background: var(--panel2);
         border: 1px solid var(--accent2); border-radius: 10px;
         padding: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #pop .title { font-size: 14px; color: var(--text); margin-bottom: 8px; }
  #pop .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #pop .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #pop .row.spr { margin-top: 8px; flex-wrap: nowrap; }
  /* max-width, not just a clamp on left: the width is measured BEFORE the
     async selects fill, so a box positioned honestly can still grow past the
     edge afterwards. Caught at 768px by mobile_probe — 780px wide, 12px off
     the left, on a viewport the phone media query never touches. */
  #pop { max-height: 86vh; overflow-y: auto; max-width: calc(100vw - 16px); }
  /* injected by showPop, so it exists on every popover. Sticky and negatively
     inset so it covers #pop's own 12px padding as content scrolls under it —
     a close button that scrolls away is not a close button. */
  #pop .popbar { position: sticky; top: -12px; z-index: 1; display: flex;
                 justify-content: flex-end; background: var(--panel2);
                 margin: -12px -12px 4px; padding: 6px 8px 4px; }
  #pop .popbar button { min-width: 44px; min-height: 44px; padding: 0;
                        font-size: 17px; line-height: 1; }
  /* quick launch: presets sit at the TOP of the launcher, before the form,
     because the whole point is not filling the form in */
  #pop .qlab { flex: 1 0 100%; font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  #pop .qlbtn { border-color: var(--accent2); color: var(--accent); }
  #pop .qlbtn:disabled { opacity: 0.5; }
  #pop .spawnerr { color: var(--accent); border: 1px solid var(--accent2);
                   border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
  #modal .qlrow { display: flex; align-items: center; gap: 8px; margin: 6px 0;
                  padding: 8px; background: var(--panel2); border-radius: 8px; }
  #modal .qlrow .qlname { flex: 1; min-width: 0; }
  #modal .qlrow .qlsum { color: var(--dim); font-size: 12px; }
  .spsel { flex: 1; min-width: 0; background: var(--in); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 14px;
    max-width: 82vw; font-family: inherit; }
  .spsel.flt { flex: 0 0 38%; }
  textarea.spsel { resize: vertical; min-height: 84px; }
  .spchk { display: flex; align-items: center; gap: 8px; color: var(--dim);
    font-size: 13px; cursor: pointer; }
  .spchk input { accent-color: var(--accent); }
  .spmic { flex: 0 0 46px; align-self: stretch; background: var(--in);
    border: 1px solid var(--line); border-radius: 6px; font-size: 19px;
    cursor: pointer; color: var(--text); }
  .spmic:hover { border-color: var(--accent); }
  #pop button { background: var(--in); border: 1px solid var(--line);
                color: var(--text); border-radius: 8px; padding: 8px 12px;
                font-size: 15px; cursor: pointer; min-width: 40px; }
  #pop button:hover { border-color: var(--accent); color: var(--accent); }
  #pop button.on { border-color: var(--accent); color: var(--accent); }
  /* min-width:0 is load-bearing, not tidiness. A flex item defaults to
     min-width:auto, which forbids it shrinking below its own min-content
     width — so ONE nowrap descendant (the status line) made #main 603px wide
     on a 412px phone, pushed every right-aligned own-message off screen, and
     let scrollIntoView strand the page scrolled right with no way back.
     Unconditional on purpose: inside the phone media query it left 768px
     (landscape / tablet) still overflowing by 197px. */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #head { padding: 10px 18px; border-bottom: 1px solid var(--line);
          background: var(--panel); font-size: 17px; display: flex;
          align-items: center; gap: 10px; flex-wrap: wrap; min-height: 52px; }
  #head .cwd { color: var(--dim); font-size: 13px; }
  #head .hlabel { color: var(--accent); font-size: 14px; }
  #hinfo { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  #hinfo .hname { font-size: 18px; }
  #hinfo .hbadges { display: flex; flex-wrap: wrap; gap: 5px; }
  #hinfo .hstatus { color: var(--accent); font-size: 14px; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; }
  #hinfo .hcwd { color: var(--dim); font-size: 12px; }
  .badge.ctx { color: #c9a35f; border-color: #8a6f3f; }
  #clearb { margin-left: auto; background: none; border: 1px solid var(--line);
            color: var(--dim); border-radius: 6px; padding: 4px 10px;
            font-size: 15px; cursor: pointer; }
  #clearb:hover { color: var(--accent); border-color: var(--accent); }
  #modal .warn { color: #e08a6a; }
  #modal .okline { color: #9dc183; }
  #modal .slug { font-family: ui-monospace, Consolas, monospace; font-size: 13px;
                 color: var(--text); word-break: break-all; }
  #modal .actions .danger { background: #8a3d2f; color: #f0e2d6; border: none; }
  #gear { background: none; border: 1px solid var(--line);
          color: var(--dim); border-radius: 8px; font-size: 17px;
          padding: 4px 12px; cursor: pointer; }
  #gear:hover { color: var(--accent); border-color: var(--accent); }
  /* settings modal */
  #overlay { position: fixed; inset: 0; background: rgba(20,16,12,0.7);
             display: flex; align-items: center; justify-content: center;
             z-index: 20; }
  #modal { background: var(--panel); border: 1px solid var(--accent2);
           border-radius: 12px; padding: 20px 24px; width: 520px;
           max-height: 85vh; overflow-y: auto; }
  #modal h2 { margin: 0 0 12px; font-size: 17px; color: var(--accent); }
  #modal h3 { margin: 16px 0 8px; font-size: 14px; color: var(--dim);
              text-transform: uppercase; letter-spacing: 0.5px; }
  #modal .srow { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  #modal .srow label { width: 130px; font-size: 14px; }
  #modal select { flex: 1; background: var(--panel2); color: var(--text);
                  border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  #modal input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent2); }
  /* wrap, because the row can hold FOUR: cancel, close out first, close,
     clear. Measured at 320px without it (tools/clear_modal_probe.mjs), the
     flex-end row overflowed to the LEFT and put Cancel at x=-39 — off the
     screen, not merely off the modal. Nothing wraps while three fit. */
  #modal .actions { display: flex; flex-wrap: wrap; justify-content: flex-end;
                    gap: 10px; margin-top: 18px; }
  #modal .actions button { border-radius: 8px; padding: 8px 18px; cursor: pointer;
        border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  #modal .actions .save { background: var(--accent2); color: #1d1812; border: none; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex;
          flex-direction: column; gap: 8px; }
  /* overflow-wrap: a token with no break opportunity (a long hash, a base64
     blob) would otherwise scroll #msgs sideways. #resp-acc already does this;
     this brings .msg in line. */
  .msg { max-width: 72%; padding: 8px 12px; border-radius: 10px; font-size: 15px;
         overflow-wrap: anywhere; }
  .msg .who { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  .msg .sayit { cursor: pointer; opacity: 0.6; margin-left: 6px; }
  .msg .sayit:hover { opacity: 1; }
  .msg.in  { background: var(--in); align-self: flex-start; }
  .msg.out { background: var(--out); align-self: flex-end; }
  .msg.peer { background: var(--peer); align-self: flex-start; opacity: 0.75;
              border-left: 2px solid var(--dead); }
  #compose { display: flex; gap: 8px; padding: 12px 18px; background: var(--panel);
             border-top: 1px solid var(--line); align-items: flex-end;
             position: relative; }
  /* align-items:flex-end keeps the buttons on the baseline of a GROWN
     textarea. It also stops them stretching, which is where their height used
     to come from — so every button now states its own, matching the box's
     one-line height. Without this they collapse to text height and float.
     HEIGHT ONLY on purpose: `#compose > button` outranks `#sendb` (an ID plus
     an element beats an ID alone), so setting flex here would silently
     override the phone layout's thirds inside its own media query. */
  #compose > button { height: 41px; }
  /* a textarea, not an input, so shift+enter can insert a real newline. It
     grows with the text up to a cap and then scrolls — a long paste must not
     push the send button off the screen. resize:none because the drag handle
     fights the auto-grow. */
  #box { flex: 1; background: var(--panel2); border: 1px solid var(--line);
         color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 15px;
         font-family: inherit; line-height: 1.35; resize: none; overflow-y: auto;
         min-height: 41px; max-height: 40vh; }
  /* a failed send has to be seen: full width above the row, not a placeholder
     that the restored text would immediately hide */
  #composeerr { display: none; flex: 1 0 100%; order: -1; color: #e08a6a;
                font-size: 13px; padding: 0 2px 6px; }
  #compose.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; }
  #compose.dragging::after { content: "drop to attach"; position: absolute;
         left: 0; right: 0; bottom: 100%; text-align: center; font-size: 13px;
         color: var(--accent); padding-bottom: 4px; }
  #sendb { background: var(--accent2); border: none; color: #1d1812;
           border-radius: 8px; padding: 0 22px; font-size: 15px; cursor: pointer; }
  #micb { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
          border-radius: 8px; padding: 0 16px; font-size: 17px; cursor: pointer; }
  #attachb { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
             border-radius: 8px; padding: 0 14px; font-size: 17px; cursor: pointer; }
  #cmdb { background: var(--panel2); border: 1px solid var(--line); color: var(--accent);
          border-radius: 8px; padding: 0 14px; font-size: 17px; cursor: pointer; }
  /* command palette */
  #cmdlist { max-height: 46vh; overflow-y: auto; margin: 8px 0; }
  .cmdrow { display: flex; align-items: center; gap: 10px; padding: 9px 8px;
            border-bottom: 1px solid var(--line); cursor: pointer; }
  .cmdrow.selq { background: var(--in); }
  .cmdrow .cn { font-weight: 600; color: var(--accent); min-width: 110px; }
  .cmdrow .cd { color: var(--dim); font-size: 13px; flex: 1; overflow: hidden;
                white-space: nowrap; text-overflow: ellipsis; }
  .cmdrow .fav { cursor: pointer; opacity: 0.5; font-size: 16px; }
  .cmdrow .fav.on { opacity: 1; color: var(--accent); }
  #micb.rec { background: #8a3d2f; border-color: #b8542f; }
  #ttsstop { display: none; position: fixed; right: 16px;
             bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 25;
             width: 64px; height: 64px; border-radius: 32px; border: none;
             background: var(--accent); color: #1d1812; font-size: 26px;
             cursor: pointer; align-items: center; justify-content: center;
             box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  /* recording modal: two thumb-sized buttons center screen */
  #recov { position: fixed; inset: 0; background: rgba(20,16,12,0.82);
           /* above #pop (40): recording controls must cover the launcher */
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 26px; z-index: 60; }
  #recov .pulse { color: #e08a6a; font-size: 19px; letter-spacing: 1px;
                  animation: recpulse 1.2s ease-in-out infinite; }
  @keyframes recpulse { 50% { opacity: 0.35; } }
  #recov .btns { display: flex; gap: 30px; }
  #recov button { width: 120px; height: 120px; border-radius: 60px;
                  font-size: 40px; border: none; cursor: pointer; }
  #recov .stopb { background: #9dc183; color: #1d1812; }
  #recov .cancelb { background: #8a3d2f; color: var(--text); }
  #recov .lbl { font-size: 14px; color: var(--dim); margin-top: 8px;
                text-align: center; }
  #empty { color: var(--dim); margin: auto; }
  #working { display: flex; gap: 5px; padding: 8px 12px; align-self: flex-start; }
  #working span { width: 9px; height: 9px; border-radius: 5px; background: var(--accent);
                  animation: wdot 1.2s ease-in-out infinite; }
  #working span:nth-child(2) { animation-delay: 0.2s; }
  #working span:nth-child(3) { animation-delay: 0.4s; }
  #working .wdoing { width: auto; height: auto; border-radius: 0; background: none;
    animation: none; color: var(--dim); font-size: 12px; margin-left: 6px;
    align-self: center; }
  @keyframes wdot { 30% { opacity: 0.25; transform: translateY(-3px); } }
  #burger { display: none; background: none; border: 1px solid var(--line);
            color: var(--text); border-radius: 8px; font-size: 18px;
            padding: 4px 12px; cursor: pointer; }
  /* phone layout: sidebar becomes a slide-over, everything full width */
  @media (max-width: 700px) {
    #side { position: fixed; inset: 0 15% 0 0; z-index: 15; width: auto !important;
            max-width: none; transform: translateX(-105%);
            transition: transform 0.18s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
    #side.open { transform: translateX(0); }
    #divider { display: none; }
    #burger { display: inline-block; }
    #head { padding: 8px 10px; font-size: 15px; align-items: flex-start; }
    #hinfo .hcwd { display: none; }  /* path is noise on the phone */
    /* phone header: one badge row max — model, context, esc; state pill
       lives beside the name now */
    #hinfo .hbadges > .badge:first-child { display: none; }  /* side */
    #hinfo .hbadges .badge:not(.model):not(.ctx):not(.escb) { display: none; }
    #hinfo .hname { font-size: 17px; }
    /* the status is the most useful line on the phone, so it wraps to two
       lines here instead of ellipsizing at one. Its desktop nowrap was what
       set #main's min-content width; with #main{min-width:0} that no longer
       overflows, but two readable lines beat one truncated one. */
    #hinfo .hstatus { white-space: normal; display: -webkit-box;
                      -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    /* phone list: thumb targets, minimum vertical cost — Chris trims:
       no title line, no channel badge, one-line preview, tight rows */
    .th { padding: 9px 12px; }
    .th .name { font-size: 17px; }
    .th .badges { gap: 6px; margin: 8px 0 6px; }
    .badge { font-size: 14px; padding: 4px 11px; border-radius: 7px; }
    .th .meta.label { display: none; }
    .badge.chan { display: none; }
    .th .meta { display: none; }          /* path: noise on phone */
    .th .preview { font-size: 13px; -webkit-line-clamp: 1; margin-top: 2px; }
    .th .edit { opacity: 1; font-size: 16px; padding: 4px; }
    .th .sweep { opacity: 1; font-size: 15px; padding: 4px; }
    #msgs { padding: 10px; }
    .msg { max-width: 92%; }
    #modal { width: 94vw; padding: 14px; }
    /* The cancel button measured 80x33 and sat below the fold inside the
       modal's own scroll. Pin the row to the bottom and give it a thumb. */
    #modal .actions { position: sticky; bottom: -14px; background: var(--panel);
                      padding: 10px 0 4px; margin-top: 4px; }
    #modal .actions button { min-height: 44px; }
    /* Popovers become a BOTTOM sheet on the phone: full width, thumb-reachable,
       geometry owned by CSS because showPop skips inline positioning in this
       mode. Measured before this rule existed: 508px wide on a 360px screen,
       76px off the left edge, 72px off the right, 121% of the viewport
       covered — which is why there was no outside left to tap. The 8px inset
       is deliberate: it keeps a visible tap-outside margin, so the existing
       dismissal gesture survives instead of being replaced. */
    #pop.sheet { left: 8px; right: 8px; top: auto;
                 bottom: calc(8px + env(safe-area-inset-bottom));
                 width: auto; max-width: none; max-height: 88vh; }
    /* nowrap on .spr plus two 82vw children is what made it 508px wide */
    #pop.sheet .row.spr { flex-wrap: wrap; }
    /* Launch measured at y=866 on a 780px screen — past nine form rows of
       scrolling. "Actions reachable with a thumb" means pinned, not present. */
    #pop.sheet .popact { position: sticky; bottom: -12px; z-index: 1;
                         background: var(--panel2); margin: 0 -12px -12px;
                         padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
    #pop.sheet .spsel { max-width: 100%; }
    #pop button { min-height: 44px; }
    /* TWO LINES on the phone: the input owns row one, the four controls share
       row two. The old single-row "thirds" plan budgeted for four children and
       the row has FIVE — #cmdb was never given an order — so two fixed buttons
       plus gaps ate 115px and the text field was left 108px at 412 and 78px at
       320. A message box you cannot read what you typed in is not a text box. */
    #compose { padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
               position: sticky; bottom: 0; gap: 6px; flex-wrap: wrap; }
    /* the row-two buttons need to GROW, so the desktop fixed height and
       flex:0 0 auto are both overridden here rather than inherited */
    #compose > button { height: 56px; }
    /* padding is vertical here, unlike the old single-line input: a textarea
       puts its text at the TOP of the box, so zero padding left it hard
       against the border instead of centred like the buttons beside it */
    #box    { order: 0; flex: 1 0 100%; min-width: 0; font-size: 16px;
              padding: 14px 12px; min-height: 56px; max-height: 30vh; }
    #cmdb   { order: 1; flex: 0 0 52px; min-height: 56px; padding: 0; font-size: 22px; }
    #attachb{ order: 2; flex: 0 0 52px; min-height: 56px; padding: 0; font-size: 22px; }
    #sendb  { order: 3; flex: 1 1 0; min-width: 0; font-size: 17px; min-height: 56px; padding: 0; }
    #micb   { order: 4; flex: 1 1 0; min-width: 0; font-size: 28px; min-height: 56px; padding: 0; }
  .th .badges .badge, .th .name .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 5px; }
  .th .badges { gap: 4px; margin: 5px 0 3px; }
  /* buttons keep a thumb-sized box while the tags go subtle */
  .rowctl .badge { font-size: 15px; padding: 5px 9px; border-radius: 8px; }
  .rowctl .badge.chan { font-size: 12px; }
  .rowctl { margin: 2px 0 0; }
  }
</style>

<body>
  <div id="side">
    <div id="tabs">
      <button id="tab-term" class="on">Terminals</button>
      <button id="tab-squad">Squads</button>
      <button id="tab-esc">Esc<span id="escbadge"></span></button>
      <button id="spawn" title="spawn a terminal tab (Windows Terminal)">＋</button>
    </div>
    <input id="filter" placeholder="filter sessions…" autocomplete="off">
    <div id="threads"></div>
  </div>
  <div id="divider" title="drag to resize"></div>
  <div id="main">
    <div id="head"><button id="burger" title="threads">☰</button><span id="hinfo">ping hub</span><button id="clearb" title="clear or close this session">⟳</button><button id="gear" title="settings">⚙</button></div>
    <div id="msgs"><div id="empty">select a thread — pings only, both directions</div></div>
    <div id="esc-list"></div>
    <button id="ttsstop" title="stop speech / skip to next">⏹</button>
    <div id="compose">
      <button id="cmdb" title="star command palette">✳</button>
      <button id="attachb" title="attach an image">📎</button>
      <input type="file" id="attachf" accept="image/*" style="display:none">
      <textarea id="box" placeholder="ping as chris…" autocomplete="off"
                rows="1"></textarea>
      <button id="sendb">Send</button>
      <button id="micb" title="tap to record, tap again to transcribe">🎤</button>
      <div id="composeerr"></div>
    </div>
  </div>
<script>
let tab = "term", sel = null, selSide = "win", roster = [], hubCfg = {};
fetch("/api/settings").then(r => r.json()).then(s => { hubCfg = s; renderList(); });

// ── timestamps a person can read ──────────────────────────────────────────
// "2:41 PM" today, "yesterday 2:41 PM", "Aug 12, 2:41 PM" older. The full
// stamp stays in the title attribute, so nothing is actually lost.
// Two spellings arrive here: the journal writes -0500 and base's graph writes
// -05:00. Safari rejects the first outright, so it is normalised before Date
// sees it — otherwise every bubble on an iPhone reads "Invalid Date".
function when(raw) {
  if (!raw) return "";
  const iso = String(raw).replace(/([+-]\d{2})(\d{2})$/, "$1:$2");
  const d = new Date(iso);
  if (isNaN(d)) return String(raw);          // unparseable: show it as given
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - day) / 86400000);
  if (days <= 0) return time;
  if (days === 1) return "yesterday " + time;
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + time;
}

// ── popover (no browser dialogs anywhere in this UI) ──────────────────────
const onPhone = () => window.matchMedia("(max-width: 700px)").matches;

function showPop(x, y, html) {
  closePop();
  const p = document.createElement("div");
  p.id = "pop";
  // The close control is injected HERE rather than left to callers. All three
  // of them omitted one, and on a phone that is not cosmetic: measured
  // 2026-08-19 at 360px, this box was 508px wide and covered 121% of the
  // viewport, so tap-outside had no outside and Esc had no key. Chris could
  // open the launcher and not get rid of it.
  p.innerHTML = `<div class="popbar"><button id="popclose" title="close">✕</button></div>` + html;
  document.body.appendChild(p);
  if (onPhone()) {
    // a sheet, and CSS owns its geometry. The inline left/top below is exactly
    // what put it at left:-76px: the clamp goes negative once the box is wider
    // than the screen, and it measures a width the async selects have not
    // filled in yet.
    p.classList.add("sheet");
  } else {
    const r = p.getBoundingClientRect();
    // Math.max(8, ...): the inner clamp goes NEGATIVE the moment the box is
    // wider than the viewport, which is how it ended up at left:-76px
    p.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 12)) + "px";
    p.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 12)) + "px";
  }
  p.querySelector("#popclose").onclick = ev => { ev.stopPropagation(); closePop(); };
  setTimeout(() => {
    // pointerdown, not mousedown: on touch the mouse event is an emulated
    // afterthought, and this is the phone's primary dismissal gesture
    document.addEventListener("pointerdown", popOutside);
    document.addEventListener("keydown", popEsc);
  }, 0);
  return p;
}
function closePop() {
  const p = document.getElementById("pop");
  if (p) p.remove();
  if (window._spDraftTimer) { clearInterval(window._spDraftTimer); window._spDraftTimer = null; }
  document.removeEventListener("pointerdown", popOutside);
  document.removeEventListener("keydown", popEsc);
}
function popOutside(e) {
  // the recording overlay lives outside #pop — its buttons must not close it
  if (!e.target.closest("#pop") && !e.target.closest("#recov")) closePop();
}
function popEsc(e) { if (e.key === "Escape") closePop(); }

async function loadRoster() {
  roster = await (await fetch("/api/threads")).json();
  // a SIBLING request, not a field on the roster: bridge-down has to be
  // answerable when the roster is EMPTY, which is exactly when it matters
  try { bridgeState = await (await fetch("/api/bridge")).json(); } catch (e) { /* hub restarting */ }
  if (spawnWatch) {
    // A wsl spawn is confirmed by the ROSTER, and the roster for that side
    // arrives only through the bridge. While the bridge is down that
    // confirmation channel is dead, so the deadline proves nothing — expiring
    // the card would hide a session that is very probably running, which is
    // exactly the failure this replaced (2026-08-19). Hold it, and give it a
    // fresh window once the bridge is back.
    const blind = spawnWatch.side === "wsl" && bridgeState.enabled &&
                  bridgeState.probed && !bridgeState.up;
    if (blind) { spawnWatch.state = "waiting"; spawnWatch.until = Date.now() + 180000; }
    // NOT null. A spawn that never appeared is a fact Chris has to see;
    // nulling it here is what made a booting card evaporate in silence.
    else if (Date.now() > spawnWatch.until) spawnWatch.state = "failed";
    else spawnWatch.state = "";
    const norm = s => (s || "").replace(/\\/g, "/").replace(/\/+$/, "").toLowerCase();
    // a fresh session may RECLAIM a dead codename already on the board, so
    // "new title" alone misses it — a session-id change on a known title
    // counts as our spawn too (ocelot lesson)
    const isNew = x => {
      const k = x.side + ":" + x.title;
      return !(k in spawnWatch.sids) ||
             (x.session_id && x.session_id !== spawnWatch.sids[k]);
    };
    const t = spawnWatch.expectTitle
      ? roster.find(x => x.side === spawnWatch.side &&
          x.title === spawnWatch.expectTitle &&
          x.session_id && x.session_id !== spawnWatch.prevSid)
      : roster.find(x => x.side === spawnWatch.side && isNew(x) &&
          (!x.cwd || norm(x.cwd) === norm(spawnWatch.cwd)));
    if (t) {
      if (spawnWatch.parent) fetch("/api/relation", { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ child: t.side + ":" + t.title,
          parent: t.side + ":" + spawnWatch.parent }) });
      spawnWatch = null;
      sel = t.title; selSide = t.side;
      // app-booted sessions keep a permanent card (survives hide-inactive
      // and gone-filtering) until Chris hides it himself
      const k = t.side + ":" + t.title;
      if (!(hubCfg.spawn_pinned || []).includes(k)) {
        hubCfg.spawn_pinned = [...(hubCfg.spawn_pinned || []), k];
        fetch("/api/settings", { method: "POST",
          headers: {"Content-Type": "application/json"}, body: JSON.stringify(hubCfg) });
      }
      loadThread();
      fetch("/api/focus", { method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ title: t.title, side: t.side }) });
    }
  }
  renderList();
  renderHeader();
  updateWorking();
}

// pulsing indicator while the OPEN thread's session is mid-tool-run
function updateWorking() {
  const t = roster.find(x => x.title === sel && x.side === selSide);
  let w = document.getElementById("working");
  if (t && t.active && tab !== "esc") {
    if (!w) {
      w = document.createElement("div");
      w.id = "working";
      w.innerHTML = `<span></span><span></span><span></span><span class="wdoing"></span>`;
      document.getElementById("msgs").appendChild(w);
    }
    w.querySelector(".wdoing").textContent = t.doing || "";
    document.getElementById("msgs").appendChild(w);  // keep it last
  } else if (w) w.remove();
}

// ── parent/child accordion ─────────────────────────────────────────────────
// Grouping is one level deep on purpose: relations.json is a flat map, not a
// tree, and a nesting folder tree is unreadable at 412px. A child whose parent
// is not in the roster renders TOP LEVEL -- an orphan swallowed by a missing
// parent is a session Chris cannot see.
const ACC_KEY = "acc-collapsed";
function accState() {
  try { return JSON.parse(localStorage.getItem(ACC_KEY) || "{}"); } catch { return {}; }
}
function accCollapsed(key) { return !!accState()[key]; }
function accToggle(key) {
  const st = accState();
  st[key] ? delete st[key] : st[key] = 1;
  localStorage.setItem(ACC_KEY, JSON.stringify(st));
  renderList();
}

function groupByParent(items) {
  const key = t => t.side + ":" + t.title;
  // the markers live on the roster objects and outlive one render, so a card
  // that has moved keeps a grouping it no longer has -- clear before grouping
  for (const t of items) { t._child = false; t._under = ""; t._kids = 0; t._key = key(t); }
  // parent is stored as a bare title; match within the same side, which is
  // how relations.json writes it (side:title -> side:title)
  const byTitle = new Map(items.map(t => [t.side + ":" + t.title, t]));
  const kids = new Map();
  for (const t of items) {
    const pk = t.parent ? t.side + ":" + t.parent : "";
    if (pk && byTitle.has(pk)) {
      if (!kids.has(pk)) kids.set(pk, []);
      kids.get(pk).push(t);
    }
  }
  const out = [];
  for (const t of items) {
    const k = key(t);
    const pk = t.parent ? t.side + ":" + t.parent : "";
    if (pk && byTitle.has(pk)) continue;     // emitted under its parent below
    t._kids = (kids.get(k) || []).length;
    t._key = k;
    out.push(t);
    for (const c of kids.get(k) || []) {
      c._child = true;
      c._under = k;
      out.push(c);
    }
  }
  return out;
}

// what a collapsed parent must still show: a brood that swallows a screaming
// child is a defect, so the counts come UP
function broodBadge(t, items) {
  if (!t._kids || !accCollapsed(t._key)) return "";
  const kids = items.filter(x => x._under === t._key);
  const esc = kids.filter(x => x.esc).length;
  const live = kids.filter(x => x.active || x.watching).length;
  return `<span class="badge orch" title="collapsed children">▸ ${t._kids}` +
         (live ? ` · ${live} live` : "") + (esc ? ` · ${esc} esc!` : "") + `</span>`;
}

function renderList() {
  const list = document.getElementById("threads");
  // Squads is the flat, always-visible list of every CHILD session (Chris's
  // order). Terminals shows everything, grouped -- squad membership survives
  // as the .badge.squad the card already renders, so no session can be absent
  // from both tabs, which the old `!t.squad` filter made possible.
  let items = tab === "squad" ? roster.filter(t => t.parent) : roster.slice();
  // hidden cards: manual hide via the pencil popup; a hidden codename whose
  // session id CHANGED has re-registered — auto-resurrect it (Chris rule)
  const hid = hubCfg.hidden || {};
  let hidDirty = false;
  for (const t of items) {
    const k = t.side + ":" + t.title;
    if (k in hid && t.session_id && hid[k] && t.session_id !== hid[k]) {
      delete hid[k]; hidDirty = true;
    }
  }
  if (hidDirty) {
    hubCfg.hidden = hid;
    fetch("/api/settings", { method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(hubCfg) });
  }
  const hiddenItems = items.filter(t => (t.side + ":" + t.title) in hid);
  items = items.filter(t => !((t.side + ":" + t.title) in hid));
  // spawn-pinned cards were booted from THIS app — always visible, whatever
  // their liveness, until Chris hides them himself
  const pinned = new Set(hubCfg.spawn_pinned || []);
  items = items.filter(t => !t.gone || t.title === sel || pinned.has(t.side + ":" + t.title));
  if (hubCfg.hide_inactive) items = items.filter(t =>
    t.watching || t.active || t.title === sel || pinned.has(t.side + ":" + t.title));
  const q = document.getElementById("filter").value.trim().toLowerCase();
  if (q) items = items.filter(t =>
    [t.title, t.display, t.label, t.cwd, t.status, t.side, t.model,
     ...(t.projects || []),
     t.last && t.last.text].filter(Boolean).join(" ").toLowerCase().includes(q));
  // manual order: card_order (settings) wins; cards not in it keep the
  // alphabetical roster order after the ordered ones (stable sort)
  const ord = hubCfg.card_order || [];
  items.sort((a, b) => {
    const ia = ord.indexOf(a.side + ":" + a.title), ib = ord.indexOf(b.side + ":" + b.title);
    return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
  });
  lastRendered = items.map(t => t.side + ":" + t.title);
  if (tab === "term") items = groupByParent(items);
  list.innerHTML = "";
  // the bridge being down is a TOP-LEVEL fact — it is reported even when no
  // wsl card exists to carry the flag, which is the state a hub started during
  // an outage is in. An empty WSL side must never read as "no sessions".
  if (tab === "term" && bridgeState.enabled && bridgeState.probed && !bridgeState.up) {
    const w = document.createElement("div");
    w.className = "th down";
    const since = bridgeState.since ? " since " + bridgeState.since.replace("T", " ") : "";
    w.innerHTML = `<div class="name">WSL bridge down<span class="badge escb">wsl</span></div>
      <div class="meta">no window onto WSL sessions${since} — they may be running unseen</div>
      <div class="meta">${bridgeState.detail || ""}</div>`;
    list.appendChild(w);
  }
  if (spawnWatch && tab === "term") {
    const b = document.createElement("div");
    const st = spawnWatch.state || "";
    // waiting and failed are DIFFERENT facts and never collapse: one says the
    // channel that would confirm this is dead, the other says the channel was
    // alive and nothing showed up. Neither is allowed to disappear on its own.
    b.className = st ? "th down" : "th gray";
    const head = st === "waiting" ? "waiting on bridge…"
               : st === "failed" ? "spawn unconfirmed" : "booting…";
    const why = st === "waiting"
      ? "the terminal may already be running — the hub cannot see WSL until the bridge is back"
      : st === "failed" ? "no session appeared within 3 min" : "";
    b.innerHTML = `<div class="name">${head} <span class="badge">${spawnWatch.side}</span>` +
      (st ? `<span class="edit" id="spawndismiss">dismiss</span>` : "") + `</div>
      <div class="meta">${spawnWatch.cwd}</div>` + (why ? `<div class="meta">${why}</div>` : "");
    list.appendChild(b);
    const d = b.querySelector("#spawndismiss");
    // dismissal is CHRIS'S call, never a timer's — that is the whole fix
    if (d) d.onclick = ev => { ev.stopPropagation(); spawnWatch = null; renderList(); };
  }
  for (const t of items) {
    if (tab === "term" && t._child && accCollapsed(t._under)) continue;
    const el = document.createElement("div");
    const statePill = t.active ? '<span class="badge act">● active</span>'
                    : (t.watching ? '<span class="badge watch">watching</span>' : '');
    // a relay mirror: this session id is registered on both sides and the
    // real one is elsewhere. It is plumbing, so it never offers to boot and
    // never reads as a session that went quiet.
    const ghost = !!t.ghost;
    const dead = !t.watching && !t.active && !ghost;
    const isSel = tab === "esc"
      ? !!(escFilter && escFilter.from === t.title && escFilter.side === t.side)
      : (t.title === sel && t.side === selSide);
    el.className = "th" + (isSel ? " sel" : "") + (t.watching || t.active ? "" : " gray")
                 + (ghost ? " ghost" : "");
    const ghostPill = ghost
      ? '<span class="badge ghostb" title="relay mirror — this codename is registered on this side so pings route, but the session runs on the other side">◌ relay</span>'
      : '';
    if (t._child) el.classList.add("kid");
    const disc = t._kids
      ? `<span class="disc" data-k="${t._key}" title="collapse this session's children">${accCollapsed(t._key) ? "▸" : "▾"}</span>`
      : "";
    el.innerHTML = `<div class="name">${disc}<span class="sweep" title="sweep out of the list (find it under hidden)">🧹</span>${t.display || t.title} ${ghostPill}${statePill}

// opus = 1m: hub spawns force opus[1m], and live pills (gossip at 486k) prove
// even the older opus sessions run the 1m window — transcripts don't mark it
const CTX_MAX = { fable: 1000000, opus: 1000000, sonnet: 200000 };
function ctxBadge(t) {
  if (!t.ctx) return "";
  const max = CTX_MAX[t.model] || 200000;
  const pct = Math.min(999, Math.round(100 * t.ctx / max));
  const k = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "m" : Math.round(n / 1000) + "k";
  return `<span class="badge ctx" title="context: ${t.ctx.toLocaleString()} of ${max.toLocaleString()} tokens">${pct}% · ${k(t.ctx)}/${k(max)}</span>`;
}

async function loadThread() {

  const box = document.getElementById("msgs");

// terminal mirror: the session's own responses, low-key behind an accordion —
// quiet sessions still surface what they say in the terminal (Chris ask)
let respOpen = false, respFor = "";
function addRespAccordion(box, open) {
  if (respFor !== selSide + ":" + sel) { open = false; respFor = selSide + ":" + sel; }
  const acc = document.createElement("div");
  acc.id = "resp-acc";
  acc.innerHTML = `<div class="rhead">▸ terminal responses</div>
    <div class="rbody" style="display:none"></div>`;
  const rh = acc.querySelector(".rhead"), rb = acc.querySelector(".rbody");
  const fillRows = async () => {
    rb.innerHTML = '<div class="rrow">loading…</div>';
    const rows = await (await fetch(`/api/responses?title=${encodeURIComponent(sel)}&side=${selSide}`)).json();
    rb.innerHTML = rows.length ? "" : '<div class="rrow">no terminal responses found</div>';
    for (const r of rows) {
      const d = document.createElement("div");
      d.className = "rrow";
      const tx = r.text.replace(/</g, "&lt;");
      d.innerHTML = tx.length > 240
        ? `<span class="short">${tx.slice(0, 240)}…</span><span class="full" style="display:none">${tx}</span><span class="rmore"> more ▸</span>`
        : tx;
      const mr = d.querySelector(".rmore");
      if (mr) mr.onclick = () => {
        const s = d.querySelector(".short"), f = d.querySelector(".full");
        const o = f.style.display === "none";
        f.style.display = o ? "inline" : "none";
        s.style.display = o ? "none" : "inline";
        mr.textContent = o ? " less ◂" : " more ▸";
      };
      rb.appendChild(d);
    }
  };
  const setOpen = o => {
    respOpen = o;
    rh.textContent = (o ? "▾" : "▸") + " terminal responses";
    rb.style.display = o ? "block" : "none";
    if (o) fillRows();
  };
  rh.onclick = () => setOpen(rb.style.display === "none");
  if (open) setOpen(true);
  box.appendChild(acc);
}

function addMsg(m) {
  const box = document.getElementById("msgs");
  const el = document.createElement("div");
  el.className = "msg " + (m.peer ? "peer" : (m.dir === "out" ? "out" : "in"));
  const text = (m.summary || "").replace(/</g, "&lt;");
  // inline image render for [image] <path> pings
  const im = (m.summary || "").match(/^\[image\] (\S+[\\/]images[\\/](\S+?[\\/][^\s]+))( — (.*))?$/);
  const LIMIT = 280;
  let body;
  if (im) {
    const rel = im[2].replace(/\\/g, "/");
    body = `<img src="/img/${rel}" style="max-width:100%;min-width:48px;min-height:32px;background:rgba(255,255,255,0.08);border-radius:8px;display:block">` +
           (im[4] ? `<div>${im[4].replace(/</g, "&lt;")}</div>` : "");
  } else
  if (text.length > LIMIT) {
    body = `<span class="short">${text.slice(0, LIMIT)}…</span><span class="full" style="display:none">${text}</span>
            <a class="more" style="color:var(--accent);cursor:pointer;font-size:13px"> more ▸</a>`;
  } else {
    body = text;
  }
  const speakable = m.dir === "in" && !m.peer && (m.summary || "").trim();
  el.innerHTML = `<div class="who">${m.from} · <span title="${(m.created || m.ts || "").replace(/"/g, "")}">${when(m.created || m.ts)}</span>` +
    (speakable ? ` <span class="sayit" title="read this aloud">🔊</span>` : "") +
    `</div>` + body;
  const sayit = el.querySelector(".sayit");
  if (sayit) sayit.onclick = () => {
    fetch("/api/tts", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text: m.summary, voice: hubCfg.tts_voice || "af_heart" }) })
      .then(r => r.ok ? r.blob() : null)
      .then(b => { if (b) { ttsQueue.push(b); ttsNext(); } });
  };
  const more = el.querySelector(".more");
  if (more) more.onclick = () => {
    const s = el.querySelector(".short"), f = el.querySelector(".full");
    const open = f.style.display === "none";
    f.style.display = open ? "inline" : "none";
    s.style.display = open ? "none" : "inline";
    more.textContent = open ? " less ◂" : " more ▸";
  };
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

// blank keys are DROPPED rather than sent empty: /api/spawn derives its own
// defaults, and "" is not the same thing to it as absent
function qlClean(payload) {
  const out = {};
  for (const [k, v] of Object.entries(payload || {})) {
    if (v === "" || v === null || v === undefined) continue;
    if (Array.isArray(v) && !v.length) continue;
    out[k] = v;
  }
  return out;
}

// The ONE spawn path. A one-tap preset and a hand-filled Launch must not
// drift: the booting card, its bridge-aware waiting state and the
// pinned-codename watch all hang off exactly this.
async function doSpawn(payload) {
  const side = payload.side || "win";
  spawnWatch = { side, cwd: payload.cwd || "", until: Date.now() + 180000,
                 parent: payload.parent && payload.parent !== "chris" ? payload.parent : "",
                 sids: Object.fromEntries(roster.map(t =>
                   [t.side + ":" + t.title, t.session_id || ""])) };
  let resp;
  try {
    const r = await fetch("/api/spawn", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload) });
    resp = await r.json();
    if (!r.ok || resp.ok === false)
      throw new Error(resp.detail || ("spawn refused (" + r.status + ")"));
  } catch (e) {
    // A spawn that fails has to SAY so. Without this the launcher just sat
    // there with a dead button and no message — indistinguishable from a hang,
    // and the booting card would have waited three minutes for a session that
    // was never started. Found 2026-08-19 by a real spawn against a shadow hub
    // that could not launch a terminal.
    spawnWatch = null;
    const bar = document.querySelector("#pop .popbar");
    if (bar && !document.querySelector(".spawnerr"))
      bar.insertAdjacentHTML("afterend",
        `<div class="hint spawnerr">spawn failed — ${String(e.message).slice(0, 160)
          .replace(/</g, "&lt;")}</div>`);
    document.querySelectorAll("#pop .qlbtn").forEach(b => { b.disabled = false; });
    renderList();
    return null;
  }
  if (resp.title && spawnWatch) {   // pinned codename: watch for IT exactly
    spawnWatch.expectTitle = resp.title;
    spawnWatch.prevSid = "";
  }
  closePop();
  renderList();
  return resp;
}

  const opt = (v, label) => `<option value="${(v || "").replace(/"/g, "&quot;")}">${label}</option>`;

    p.querySelector("#sp-parent").innerHTML = opt("", "no parent") +

  };
  const saveForm = () => localStorage.setItem(FKEY, JSON.stringify({
    side, ws: p.querySelector("#sp-ws").value, parent: p.querySelector("#sp-parent").value,
    boot: p.querySelector("#sp-boot-ping").checked,

    ff: p.querySelector("#sp-ff").value,

    prompt: p.querySelector("#sp-prompt").value }));
  // the /api/spawn body this form describes — one reader, so Launch and

  const formPayload = () => ({
    side, cwd: p.querySelector("#sp-ws").value,
    gated: p.querySelector("#sp-gated").checked,
    prompt: p.querySelector("#sp-prompt").value,
    parent: p.querySelector("#sp-parent").value,

  // one tap per preset, straight to /api/spawn — no second dialog

      <div class="row spr popact"><button id="qlok" style="flex:1">Save preset</button></div>`);
    const nameEl = document.getElementById("qlname");

  };
  ["#sp-pf", "#sp-hf", "#sp-ff"].forEach(id => p.querySelector(id).oninput = fillLists);
  p.querySelector("#sp-ws").addEventListener("change", loadMeta);
  p.querySelectorAll("#sp-sides button").forEach(b => b.onclick = () => {
    side = b.dataset.side;

  p.querySelector("#sp-pf").value = saved.pf || "";
  p.querySelector("#sp-hf").value = saved.hf || "";
  p.querySelector("#sp-ff").value = saved.ff || "";
  const setv = (id, v) => { const el = p.querySelector(id);

  // restore order matters: workspace first (meta is scoped to it), then the

  p.querySelector("#sp-ws").innerHTML = (wsCache[side] || []).map(w =>
    opt(w.path, w.name + " — " + w.path)).join("");
  setv("#sp-ws", saved.ws);

  p.querySelector("#sp-mic").onclick = () => startRec({ label: "initial prompt",

      const t = document.getElementById("sp-prompt");

        let s = {};

        s.prompt = ((s.prompt || "") + " " + text).trim();

  p.querySelectorAll("select,input,textarea").forEach(el => {

  p.querySelector("#sp-clear").onclick = () => {

     "#sp-parent", "#sp-proj"].forEach(id => p.querySelector(id).value = "");

// ── escalation decision cards: ONE collapsible block per session, its
// escalations appended inside, each individually collapsible (Chris spec) ──
let escFilter = null, escOpen = {}, escCardOpen = {};
async function loadEscalations() {
  const cards = await (await fetch("/api/escalations")).json();
  const pending = cards.filter(c => c.status === "pending");
  document.getElementById("escbadge").textContent = pending.length || "";
  const list = document.getElementById("esc-list");
  list.innerHTML = "";
  if (!cards.length) {
    list.innerHTML = '<div id="empty" style="margin:40px auto;text-align:center;color:var(--dim)">no escalations — build sessions ping chris with ESCALATION[topic]: …</div>';
    return;
  }
  if (escFilter) {
    const bar = document.createElement("div");
    bar.className = "escfbar";
    bar.innerHTML = `showing only <b>${escFilter.from}</b> (${escFilter.side}) — tap here (or the card again) to clear`;
    bar.onclick = () => { escFilter = null; renderList(); loadEscalations(); };
    list.appendChild(bar);
  }
  const groups = new Map();
  for (const c of cards) {
    const k = c.side + ":" + c.from;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  }
  const pendOf = k => groups.get(k).filter(c => c.status === "pending").length;
  const keys = [...groups.keys()]
    .filter(k => !escFilter || k === escFilter.side + ":" + escFilter.from)
    .sort((a, b) => pendOf(b) - pendOf(a));
  if (!keys.length) {
    const d = document.createElement("div");
    d.style.cssText = "margin:40px auto;text-align:center;color:var(--dim)";
    d.textContent = `no escalations from ${escFilter.from}`;
    list.appendChild(d);
  }
  for (const k of keys) {
    const g = groups.get(k);
    g.sort((a, b) => (a.status === "pending" ? 0 : 1) - (b.status === "pending" ? 0 : 1) ||
                     String(b.ts || "").localeCompare(String(a.ts || "")));
    const pend = pendOf(k);
    if (!(k in escOpen)) escOpen[k] = pend > 0;
    const blk = document.createElement("div");
    blk.className = "escblk";
    const head = document.createElement("div");
    head.className = "bhead";
    head.innerHTML = `<span class="chev">${escOpen[k] ? "▾" : "▸"}</span>
      <b>${g[0].from}</b><span class="badge">${g[0].side}</span>
      ${pend ? `<span class="badge escb">${pend} pending</span>` : '<span class="badge">all handled</span>'}
      <span class="cnt">${g.length} escalation${g.length > 1 ? "s" : ""}</span>`;
    head.onclick = () => { escOpen[k] = !escOpen[k]; loadEscalations(); };
    blk.appendChild(head);
    if (escOpen[k]) g.forEach((c, i) => blk.appendChild(escCard(c, i)));
    list.appendChild(blk);
  }
}

function escCard(c, i) {
  const done = c.status !== "pending";
  if (!(c.id in escCardOpen)) escCardOpen[c.id] = !done;
  const open = escCardOpen[c.id];
  const el = document.createElement("div");
  el.className = "card inblk" + (done ? " answered" : "");
  const resumeCmd = c.session_id
    ? `claude --dangerously-skip-permissions --resume ${c.session_id}` : "";
  el.innerHTML = `<div class="chead"><span class="chev">${open ? "▾" : "▸"}</span>
      <span class="num">#${i + 1}</span>
      <span class="topic">${(c.topic || "?").replace(/</g, "&lt;")}</span>
      <span class="meta">${age(c.ts)}${c.status === "answered" ? " · answered " + age(c.answered_ts) : ""}${c.status === "dismissed" ? " · dismissed " + age(c.answered_ts) : ""}</span></div>` +
    (!open ? "" :
      `<div class="q">${(c.question || "").replace(/</g, "&lt;")}</div>` +
      (c.status === "answered"
        ? `<div class="answer">${(c.reply || "").replace(/</g, "&lt;")}</div>`
        : (c.status === "dismissed" ? "" :
           `<div class="reply"><input placeholder="your call…"><button class="ans">Answer</button>
            <button class="dis" title="archive without answering">Dismiss</button>
            ${c.session_id ? `<button class="res" title="reopen the asking session as a terminal tab">Resume</button>
            <button class="cpy" title="copy: ${resumeCmd}">Copy cmd</button>` : ""}</div>`)));
  el.querySelector(".chead").onclick = ev => {
    if (ev.target.closest("input,button")) return;
    escCardOpen[c.id] = !open;
    loadEscalations();
  };
  if (open && !done) {
    const input = el.querySelector("input");
    const go = async () => {
      if (!input.value.trim()) return;
      await fetch("/api/escalation-reply", { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ id: c.id, msg: input.value.trim() }) });
      loadEscalations();
    };
    el.querySelector(".ans").onclick = go;
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    el.querySelector(".dis").onclick = async () => {
      await fetch("/api/escalation-dismiss", { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ id: c.id }) });
      loadEscalations();
    };
    const res = el.querySelector(".res");
    if (res) res.onclick = () => fetch("/api/escalation-resume", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id: c.id }) });
    const cpy = el.querySelector(".cpy");
    if (cpy) cpy.onclick = async () => {
      await navigator.clipboard.writeText(resumeCmd);
      cpy.textContent = "Copied ✓";
      setTimeout(() => { cpy.textContent = "Copy cmd"; }, 1500);
    };
  }
  return el;
}

function age(ts) {
  if (!ts) return "";
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 129600) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function composeError(text) {
  const el = document.getElementById("composeerr");
  el.textContent = text || "";
  el.style.display = text ? "block" : "none";
}

// Optimistic: the box empties the moment you hit send, not after the relay
// round trip — that wait ran up to ~10s and made the app feel stuck. The cost
// of optimism is that a failure must be LOUD and must give the words back,
// otherwise a lost message looks exactly like a sent one.
async function send() {
  const box = document.getElementById("box");
  const text = box.value.trim();
  if (!sel || !text) return;
  const toTitle = sel, toSide = selSide;      // the thread may change mid-flight
  box.value = "";
  localStorage.removeItem("draft:" + toSide + ":" + toTitle);
  growBox();
  composeError("");
  let ok = false, detail = "";
  try {
    const r = await fetch("/api/send", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ title: toTitle, side: toSide, msg: text }) });
    ok = r.ok;
    if (!ok) detail = ((await r.json().catch(() => ({}))).detail || "").slice(0, 120);
  } catch (e) {
    detail = e.message;
  }
  if (ok) return;
  // give the words back without eating anything typed while it was in flight
  if (sel === toTitle && selSide === toSide) {
    box.value = box.value.trim() ? text + "\n" + box.value : text;
    localStorage.setItem("draft:" + toSide + ":" + toTitle, box.value);
    growBox();
    composeError(`not sent to ${toTitle}${detail ? " — " + detail : ""}. Text restored.`);
  } else {
    // Chris navigated away: park it as that thread's draft and say so here
    localStorage.setItem("draft:" + toSide + ":" + toTitle, text);
    composeError(`not sent to ${toTitle} — saved as a draft on that thread.`);
  }
}
document.getElementById("sendb").onclick = send;
// Slack-style drafts: unsent text is keyed per thread and survives navigation
// and reloads indefinitely — cleared only by a successful send
document.getElementById("box").addEventListener("input", () => {

document.getElementById("cmdb").onclick = async () => {
  if (!sel) return;
  const cmds = await (await fetch("/api/commands")).json();
  const favs = new Set(hubCfg.cmd_favs || []);
  const picked = new Set();
  const ov = document.createElement("div");
  ov.id = "overlay";
  ov.innerHTML = `<div id="modal">
    <h2>star commands → ${sel}</h2>
    <input id="cmdq" placeholder="filter…" style="width:100%;background:var(--panel2);
      border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:15px">
    <div id="cmdlist"></div>
    <div class="actions"><button class="cancel">Cancel</button>
      <button class="save" id="cmdsend" disabled>Send 0</button></div>
  </div>`;
  document.body.appendChild(ov);
  const listEl = ov.querySelector("#cmdlist");
  const sendBtn = ov.querySelector("#cmdsend");
  const render = q => {
    const term = (q || "").toLowerCase();
    const rows = cmds.filter(c => !term || c.name.includes(term) ||
                                   (c.description || "").toLowerCase().includes(term));
    rows.sort((a, b) => (favs.has(b.name) - favs.has(a.name)) || a.name.localeCompare(b.name));
    listEl.innerHTML = rows.map(c =>
      `<div class="cmdrow ${picked.has(c.name) ? "selq" : ""}" data-n="${c.name}">
         <span class="cn">*${c.name}</span><span class="cd" title="${(c.description || "").replace(/"/g, "&quot;").replace(/</g, "&lt;")}">${(c.description || "").replace(/</g, "&lt;")}</span>
         <span class="fav ${favs.has(c.name) ? "on" : ""}" title="favorite">★</span>
       </div>`).join("");
    listEl.querySelectorAll(".cmdrow").forEach(r => {
      const n = r.dataset.n;
      r.onclick = () => {
        picked.has(n) ? picked.delete(n) : picked.add(n);
        sendBtn.disabled = !picked.size;
        sendBtn.textContent = "Send " + picked.size;
        render(ov.querySelector("#cmdq").value);
      };
      r.querySelector(".fav").onclick = async ev => {
        ev.stopPropagation();
        favs.has(n) ? favs.delete(n) : favs.add(n);
        hubCfg.cmd_favs = [...favs];
        await fetch("/api/settings", { method: "POST",
          headers: {"Content-Type": "application/json"}, body: JSON.stringify(hubCfg) });
        render(ov.querySelector("#cmdq").value);
      };
    });
  };
  render("");
  ov.querySelector("#cmdq").oninput = e => render(e.target.value);
  ov.querySelector("#cmdq").focus();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector(".cancel").onclick = () => ov.remove();
  sendBtn.onclick = async () => {
    // one ping carrying all picked commands — base stacks *a *b like a prompt
    const msg = [...picked].map(n => "*" + n).join(" ");
    await fetch("/api/send", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ title: sel, side: selSide, msg }) });
    ov.remove();
  };
};

// ── phone mic → desktop Parakeet STT (big stop/cancel modal) ─────────────
let rec = null, chunks = [], recCancelled = false, recTarget = null;
document.getElementById("micb").onclick = () =>
  startRec(sel ? { title: sel, side: selSide } : null);
async function startRec(target) {
  const btn = document.getElementById("micb");
  recTarget = target;
  if (rec && rec.state === "recording") return;  // modal owns stop/cancel
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recCancelled = false;
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      const ov = document.getElementById("recov");
      if (ov) ov.remove();
      btn.classList.remove("rec");
      stream.getTracks().forEach(t => t.stop());
      if (recCancelled) { btn.textContent = "🎤"; ttsNext(); return; }
      btn.textContent = "…";
      const blob = new Blob(chunks, { type: rec.mimeType });
      try {
        const r = await (await fetch("/api/stt", { method: "POST", body: blob })).json();
        const box = document.getElementById("box");
        if (r.ok && r.text) {
          const text = r.text.trim();
          if (recTarget && recTarget.into) {
            recTarget.into(text);
          } else if (hubCfg.voice_autosend !== false && recTarget) {
            // desktop-PTT semantics: speak -> the ping fires at the target
            await fetch("/api/send", { method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ title: recTarget.title, side: recTarget.side, msg: text }) });
          } else {
            box.value = (box.value ? box.value + " " : "") + text;
            growBox();
          }
        } else if (r.ok && !r.text) {
          box.placeholder = "heard nothing — mic caught no speech, try again";
        } else if (!r.ok) box.placeholder = "stt failed: " + (r.detail || "");
      } finally { btn.textContent = "🎤"; ttsNext(); }
    };
    // recording starts: silence any speech immediately, hold the queue
    if (ttsPlaying) { const a = ttsPlaying; ttsPlaying = null; a.pause(); }
    rec.start();
    btn.classList.add("rec");
    const ov = document.createElement("div");
    ov.id = "recov";
    ov.innerHTML = `<div class="pulse">● recording${target ? " → " + (target.title || target.label || "") : ""}</div>
      <div class="btns">
        <div><button class="stopb" title="stop and send">■</button><div class="lbl">send</div></div>
        <div><button class="cancelb" title="cancel">✕</button><div class="lbl">cancel</div></div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector(".stopb").onclick = () => rec.stop();
    ov.querySelector(".cancelb").onclick = () => { recCancelled = true; rec.stop(); };
  } catch (e) {
    btn.textContent = "🎤";
    document.getElementById("box").placeholder = "mic blocked: " + e.message;
  }
}
// Enter sends, shift+enter inserts a newline. The textarea would insert one on
// a bare Enter too, so that path has to be prevented explicitly or every send
// would leave a stray blank line behind.
document.getElementById("box").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.isComposing) return;     // mid-IME candidate selection is not a send
  e.preventDefault();
  send();
});

// Grow to fit, up to the CSS max-height, then let it scroll. Height is reset
// before measuring because scrollHeight never shrinks on its own.
function growBox() {
  const b = document.getElementById("box");
  b.style.height = "auto";
  // the cap comes from the stylesheet, not from a number repeated here —
  // desktop and phone use different max-heights and they must not drift
  const cap = parseFloat(getComputedStyle(b).maxHeight) || Infinity;
  b.style.height = Math.min(b.scrollHeight, cap) + "px";
}
document.getElementById("box").addEventListener("input", growBox);
addEventListener("resize", growBox);

// ── drag and drop: store the file, put its path in the box ────────────────
// Deliberately does NOT send. The paperclip pings immediately; a drop hands
// the path back so Chris can write around it and send once. Doing both would
// deliver the same attachment twice.
(function dropzone() {
  const compose = document.getElementById("compose");
  const box = document.getElementById("box");
  let depth = 0;                 // dragenter/leave fire per child element

  async function store(file) {
    const q = new URLSearchParams({ title: sel, side: selSide,
                                    name: file.name || "", send: "0" });
    const r = await fetch("/api/attach?" + q, { method: "POST",
      headers: { "Content-Type": file.type || "application/octet-stream" },
      body: file });
    return r.json();
  }

  addEventListener("dragover", e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes("Files")) return;
    e.preventDefault();
    compose.classList.add("dragging");
  });
  addEventListener("dragenter", () => { depth++; });
  addEventListener("dragleave", () => { if (--depth <= 0) compose.classList.remove("dragging"); });
  addEventListener("drop", async e => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    depth = 0;
    compose.classList.remove("dragging");
    if (!sel) { box.placeholder = "pick a thread first, then drop"; return; }
    for (const file of e.dataTransfer.files) {
      if (file.size > 25e6) {    // the daemon refuses above this; say so here
        box.placeholder = `${file.name} is too large (25 MB limit)`;
        continue;
      }
      try {
        const out = await store(file);
        if (!out.ok) { box.placeholder = "attach failed: " + (out.detail || ""); continue; }
        box.value = (box.value ? box.value.replace(/\s*$/, "\n") : "") + out.path;
        growBox();
        box.focus();
      } catch (err) {
        box.placeholder = "attach failed: " + err.message;
      }
    }
  });
})();

const es = new EventSource("/api/events");
es.onmessage = ev => {
  const d = JSON.parse(ev.data);
  if (d.event === "roster") loadRoster();
  if (d.event === "message" && d.title === sel && d.side === selSide) addMsg(d);
  if (d.event === "escalation") refreshEscBadge();
  // spoken replies: the armed thread's inbound pings get read aloud (queued)
  if (d.event === "message" && hubCfg.tts_on && !d.peer && d.dir === "in"
      && hubCfg.tts_thread === d.side + ":" + d.title && d.summary) {
    fetch("/api/tts", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text: d.summary, voice: hubCfg.tts_voice || "af_heart" }) })
      .then(r => r.ok ? r.blob() : null)
      .then(b => { if (b) { ttsQueue.push(b); ttsNext(); } });
  }
};

// ── speech queue + big stop control ──────────────────────────────────────
let ttsQueue = [], ttsPlaying = null;
function ttsNext() {
  // never talk over an open mic — queue holds until recording ends
  if (rec && rec.state === "recording") return;
  if (ttsPlaying || !ttsQueue.length) return;
  const a = new Audio(URL.createObjectURL(ttsQueue.shift()));
  ttsPlaying = a;
  document.getElementById("ttsstop").style.display = "flex";
  a.onended = a.onerror = () => {
    ttsPlaying = null;
    if (!ttsQueue.length) document.getElementById("ttsstop").style.display = "none";
    ttsNext();
  };
  a.play().catch(() => { ttsPlaying = null; ttsNext(); });
}
document.getElementById("ttsstop").onclick = () => {
  // skip to the next queued message; tap again to silence everything
  if (ttsPlaying) { const a = ttsPlaying; ttsPlaying = null; a.pause(); }
  if (!ttsQueue.length) document.getElementById("ttsstop").style.display = "none";
  ttsNext();
};

async function refreshEscBadge() {

// ── clear / close the open session (⟳) ────────────────────────────────────
// Two destructive actions behind one confirm. The modal states what WILL
// happen before it can happen: whether the process can even be confirmed, and
// which handoff document a reboot would hand the fresh session. A project
// match is labelled as such, because it may be another session's document.
document.getElementById("clearb").onclick = async () => {
  if (!sel) return;
  const q = new URLSearchParams({ title: sel, side: selSide });
  let p;
  try {
    p = await (await fetch("/api/clear-preview?" + q)).json();
  } catch (e) {
    p = { reapable: false, reason: e.message, handoff: { found: false } };
  }
  const h = p.handoff || { found: false };
  const ov = document.createElement("div");
  ov.id = "overlay";
  const canAct = !!p.reapable;
  ov.innerHTML = `<div id="modal">
    <h2>clear ${sel}</h2>
    ${canAct
      ? `<div class="hint">This ends ${sel}'s terminal and everything running in
           it. Unsaved work in that tab is gone.</div>`
      : `<div class="hint warn">Cannot end this session: ${p.reason || "unknown"}</div>`}
    <h3>handoff</h3>
    <div class="${h.found ? (h.via === "project" ? "warn" : "okline") : "warn"}">
      ${h.found ? h.headline : "NO HANDOFF DETECTED"}</div>
    ${h.found ? `<div class="slug">${h.slug}</div>` : ""}
    <div class="hint">${h.detail || ""}</div>
    ${canAct && !h.found
      ? `<div class="hint">No handoff means ending it now loses what it knows.
           <b>Close out first</b> asks the session to run its end-of-session
           ritual, register a handoff, and then end itself — it stays up for a
           few minutes and the card clears when it is done.</div>`
      : ""}
    <div class="actions">
      <button class="cancel">Cancel</button>
      ${canAct && !h.found ? `<button class="save" id="do-endclose">Close out first</button>` : ""}
      ${canAct ? `<button class="danger" id="do-close">Close session</button>
                  <button class="save" id="do-clear">Clear and reboot</button>` : ""}
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector(".cancel").onclick = () => ov.remove();
  if (!canAct) return;

  const act = async (path, btn) => {
    btn.disabled = true;
    btn.textContent = "working…";
    let out = {};
    try {
      out = await (await fetch(path, { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ title: sel, side: selSide }) })).json();
    } catch (e) {
      out = { ok: false, detail: e.message };
    }
    if (!out.ok) {              // never close the modal on a failure
      btn.disabled = false;
      btn.textContent = "retry";
      ov.querySelector("h2").insertAdjacentHTML("afterend",
        `<div class="hint warn">${out.detail || "failed"}</div>`);
      return;
    }
    ov.remove();
    loadRoster();
  };
  ov.querySelector("#do-clear").onclick = e => act("/api/clear", e.target);
  ov.querySelector("#do-close").onclick = e => act("/api/close-session", e.target);

  // Close-out first does NOT end anything — it hands the session an
  // instruction and the ritual takes minutes. So this one must not borrow
  // act()'s ending: dismissing the modal and refreshing a roster the session
  // is still on would read as "nothing happened".
  const eb = ov.querySelector("#do-endclose");
  if (eb) eb.onclick = async e => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = "asking…";
    let out = {};
    try {
      out = await (await fetch("/api/end-then-close", { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ title: sel, side: selSide }) })).json();
    } catch (err) {
      out = { ok: false, detail: err.message };
    }
    if (!out.ok) {
      btn.disabled = false;
      btn.textContent = "retry";
      ov.querySelector("h2").insertAdjacentHTML("afterend",
        `<div class="hint warn">${out.detail || "failed"}</div>`);
      return;
    }
    btn.textContent = "asked";
    ov.querySelector("h2").insertAdjacentHTML("afterend",
      `<div class="hint okline">${sel} was asked to close out and then end
         itself. It writes its handoff first, so give it a few minutes — the
         card goes when the session does.</div>`);
  };
};

// ── settings modal (gear) ─────────────────────────────────────────────────
const ACTIONS = [["start", "mic open"], ["finish", "mic close"], ["send", "delivered"],
