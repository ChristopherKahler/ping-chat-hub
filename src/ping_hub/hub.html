  ov.querySelector("#set-body").innerHTML = `
    <h3>sound effects — per action</h3>${rows}
    <h3>list</h3>
    <div class="srow"><input type="checkbox" id="s-hide" ${s.hide_inactive ? "checked" : ""}>
      <label style="width:auto">hide inactive sessions (not watching, not active)</label></div>
    <div class="srow"><input type="checkbox" id="s-voice" ${s.voice_autosend !== false ? "checked" : ""}>
      <label style="width:auto">voice sends the ping immediately (uncheck = review in box first)</label></div>
    <h3>text to speech (kokoro — spoken replies, phone included)</h3>
    <div class="srow"><input type="checkbox" id="s-tts" ${s.tts_on ? "checked" : ""}>
      <label style="width:auto">speak inbound pings aloud</label></div>
    <div class="srow"><label>voice</label><select id="s-ttsvoice">
      <option>${s.tts_voice || "af_heart"}</option></select></div>
    <div class="hint" id="voicenote">loading voices…</div>
    <div class="srow"><label>speak thread</label><select id="s-ttsthread">
      <option value="">— none —</option>
      ${roster.filter(t => !t.gone).map(t => {
        const k = t.side + ":" + t.title;
        return `<option value="${k}" ${s.tts_thread === k ? "selected" : ""}>${t.display || t.title} (${t.side}${t.channel !== "" ? " · ch " + t.channel : ""})</option>`;
      }).join("")}
    </select></div>
    <h3>new terminal defaults (＋ button)</h3>
    <div class="srow"><label>model</label><select id="s-model">
      ${["fable", "opus", "sonnet"].map(m => `<option ${s.spawn_model === m ? "selected" : ""}>${m}</option>`).join("")}

    <h3>quick launch — one-tap terminals</h3>
    <div class="hint">Each preset becomes a button at the top of the ＋ launcher.
      One tap spawns it with exactly these settings, no dialog. To capture a

    <div id="qllist"></div>
    <div class="srow"><button id="qladd">Add preset</button></div>
    <div id="audiosec"></div>
    <h3>spoken word fixes — applied to every transcript</h3>

  ov.querySelector(".save").disabled = false;

  // quick launch rows
  const qlHost = ov.querySelector("#qllist");
  const qlAdd = q => {
    const node = qlRowNode(q);
    const pl = (q && q.payload) || {};
    if (q && q.id) node.dataset.id = q.id;
    // round-tripped untouched through the settings editor, which has no
    // widgets for them — dropping them here would quietly gut a preset
    // captured from the launcher
    node.dataset.prompt = pl.prompt || "";
    node.dataset.forks = JSON.stringify(pl.forks || []);
    node.dataset.handoffs = JSON.stringify(pl.handoffs || []);
    node.dataset.reportBoot = String(pl.report_boot !== false);
    qlHost.appendChild(node);
  };
  qlAll().forEach(qlAdd);
  if (!qlAll().length)
    qlHost.innerHTML = '<div class="hint">none yet — add one, or capture the launcher form with Save preset.</div>';
  ov.querySelector("#qladd").onclick = () => {
    const hint = qlHost.querySelector(".hint");
    if (hint) hint.remove();
    qlAdd(null);
  };

  // rebuilt from the array on every change so row indices never drift out of

  let pairs = (reps.pairs || []).map(p => ({ ...p }));
  function drawReps() {
    const host = ov.querySelector("#reps");
    host.innerHTML = pairs.length ? "" :
      '<div class="hint">none yet — the mic sends what it hears, unchanged.</div>';
    pairs.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "reprow";
      row.innerHTML = `<input type="checkbox" ${p.enabled !== false ? "checked" : ""}

    });

  ov.querySelector("#rep-add").onclick = () => {
    pairs.push({ from: "", to: "", enabled: true });
    drawReps();
    const last = ov.querySelectorAll(".reprow .rfrom");
    if (last.length) last[last.length - 1].focus();
  };

  // ── import star-commands as spoken fixes ────────────────────────────────
  // Speech models render "*end" as "star end", so every command becomes a pair
  // heard "star <name>" -> sent "*<name>". The server owns generation and the
  // skip rule; this is the picker.
  const repKey = s => String(s || "").trim().split(/\s+/).join(" ").toLowerCase();
  const repHeard = n =>
    "star " + String(n).replace(/[-_]/g, " ").trim().split(/\s+/).join(" ");
  const repMsg = (text, bad) => {
    const el = ov.querySelector("#repmsg");
    el.textContent = text || "";
    el.className = bad ? "hint warn" : "hint";
  };

  let cmdCache = null;
  async function loadCmds() {
    if (cmdCache) return cmdCache;
    try {
      const got = await (await fetch("/api/commands")).json();
      if (!Array.isArray(got)) {
        repMsg("commands.toml: " + ((got && got.error) || "unreadable"), true);
        return null;
      }
      cmdCache = got;
      return got;
    } catch (e) {
      repMsg("could not read commands — " + e.message, true);
      return null;
    }
  }

  // The import COMMITS, and the merge base is what THIS modal holds — so a
  // pair typed and not yet saved survives it. Re-syncing from the reply is
  // what stops the later Save from writing a stale list back over the import.
  async function importCommands(names, btn) {
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "importing…";
    let out;
    try {
      out = await (await fetch("/api/replacements/import", { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ pairs, names }) })).json();
    } catch (e) {
      out = { ok: false, detail: e.message };
    }
    btn.disabled = false;
    btn.textContent = label;
    if (!out || !out.ok) {
      repMsg((out && out.detail) || "import failed", true);
      return out;
    }
    pairs = (out.pairs || []).map(p => ({ ...p }));
    drawReps();
    const bits = [`${out.added} imported`, `${out.skipped} already present`];
    if ((out.unknown || []).length) bits.push(`${out.unknown.length} not in commands.toml`);
    repMsg(bits.join(", "));
    return out;
  }

  ov.querySelector("#rep-all").onclick = async e => {
    const cmds = await loadCmds();
    if (cmds) importCommands(cmds.map(c => c.name), e.target);
  };
  ov.querySelector("#rep-fav").onclick = async e => {
    const favs = hubCfg.cmd_favs || [];
    // no favourites imports NOTHING — never everything
    if (!favs.length) { repMsg("no favourites yet — star commands in the ✳ palette first"); return; }
    importCommands([...favs], e.target);
  };

  ov.querySelector("#rep-imp").onclick = async () => {
    const cmds = await loadCmds();
    if (!cmds) return;
    const favs = new Set(hubCfg.cmd_favs || []);
    const picked = new Set();
    // a second overlay above settings: nothing in this page ever looks
    // #overlay up, and at equal z-index the later node paints on top
    const iv = document.createElement("div");
    iv.id = "overlay";
    iv.innerHTML = `<div id="modal">
      <h2>import commands as spoken fixes</h2>
      <div class="hint">heard "star &lt;name&gt;" → sent "*&lt;name&gt;". Commands you
        already have a fix for are marked, and an import skips them.</div>
      <input id="impq" placeholder="filter…" style="width:100%;background:var(--panel2);
        border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:15px">
      <div id="cmdlist"></div>
      <div id="impmsg" class="hint"></div>
      <div class="actions"><button class="cancel">Cancel</button>
        <button id="impall" class="repadd">select all shown</button>
        <button class="save" id="impgo" disabled>import 0 selected</button></div>
    </div>`;
    document.body.appendChild(iv);
    const listEl = iv.querySelector("#cmdlist");
    const goBtn = iv.querySelector("#impgo");
    let shown = [];
    const render = q => {
      const term = (q || "").toLowerCase();
      const held = new Set(pairs.map(p => repKey(p.from)));
      shown = cmds.filter(c => !term || c.name.toLowerCase().includes(term) ||
                                (c.description || "").toLowerCase().includes(term));
      shown.sort((a, b) => (favs.has(b.name) - favs.has(a.name)) ||
                            a.name.localeCompare(b.name));
      listEl.innerHTML = shown.map(c => {
        const has = held.has(repKey(repHeard(c.name)));
        return `<div class="cmdrow ${picked.has(c.name) ? "selq" : ""}" data-n="${c.name}">
          <input type="checkbox" class="box" ${picked.has(c.name) ? "checked" : ""}>
          <span class="cn">*${c.name}</span>
          <span class="cd" title="${(c.description || "").replace(/"/g, "&quot;").replace(/</g, "&lt;")}">${(c.description || "").replace(/</g, "&lt;")}</span>
          ${has ? '<span class="have">already a fix</span>' : ""}
          <span class="fav ${favs.has(c.name) ? "on" : ""}" title="favourite">★</span>
        </div>`;
      }).join("");
      listEl.querySelectorAll(".cmdrow").forEach(r => {
        r.onclick = () => {
          const n = r.dataset.n;
          picked.has(n) ? picked.delete(n) : picked.add(n);
          render(iv.querySelector("#impq").value);
        };
      });
      goBtn.disabled = !picked.size;
      goBtn.textContent = `import ${picked.size} selected`;
    };
    render("");
    iv.querySelector("#impq").oninput = e => render(e.target.value);
    iv.querySelector("#impq").focus();
    iv.querySelector("#impall").onclick = () => {
      shown.forEach(c => picked.add(c.name));
      render(iv.querySelector("#impq").value);
    };
    iv.onclick = e => { if (e.target === iv) iv.remove(); };
    iv.querySelector(".cancel").onclick = () => iv.remove();
    goBtn.onclick = async e => {
      const out = await importCommands([...picked], e.target);
      if (!out || !out.ok) {
        // never close on a failure: closing looks identical to succeeding
        const m = iv.querySelector("#impmsg");
        m.textContent = (out && out.detail) || "import failed";
        m.className = "hint warn";
        return;
      }
      iv.remove();
    };
  };

  ov.querySelector(".save").onclick = async () => {
    const sounds = {};
    ov.querySelectorAll("input[data-k]").forEach(cb => { sounds[cb.dataset.k] = cb.checked; });
    ov.querySelectorAll("select[data-w]").forEach(se => { sounds[se.dataset.w + "_wav"] = se.value; });
    // SPREAD, do not replace. This literal names eight keys; the object also
    // carries card_order, cmd_favs, hidden, spawn_pinned and quick_launch, and
    // rebuilding it from scratch silently threw all of those away every time
    // Save was pressed. /api/settings stores whatever it is handed, so the
    // wipe persisted.
    hubCfg = { ...hubCfg, sounds,
      hide_inactive: ov.querySelector("#s-hide").checked,
      voice_autosend: ov.querySelector("#s-voice").checked,
      tts_on: ov.querySelector("#s-tts").checked,
      tts_voice: ov.querySelector("#s-ttsvoice").value,
      tts_thread: ov.querySelector("#s-ttsthread").value,
      spawn_model: ov.querySelector("#s-model").value,
      spawn_effort: ov.querySelector("#s-effort").value,
      quick_launch: readQuickRows(ov) };
    await fetch("/api/settings", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(hubCfg) });
    // a rule with a blank left side matches nothing; drop the empty rows an
    // add-then-cancel leaves behind rather than storing rules that do nothing
    await fetch("/api/replacements", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ pairs: pairs.filter(p => (p.from || "").trim()) }) });
    ov.remove();
    renderList();
  };

  // last, and never awaited by anything above it
  fillVoices(ov, s.tts_voice);
  fillAudio(ov);
};

// The voice list is the one slow thing behind the gear: answering it can mean
// waking kokoro, which loads a 310MB model. The server now answers inside 2s
// with {warming:true} instead of blocking, so this polls until the real list
// lands. "warming" is not "one voice" — saying so in the note is the whole
// point, because a silently short list reads as a broken install.
async function fillVoices(ov, current) {
  const sel = ov.querySelector("#s-ttsvoice");
  const note = ov.querySelector("#voicenote");
  if (!sel) return;
  const want = current || "af_heart";
  for (let attempt = 0; attempt < 15; attempt++) {
    let out;
    try {
      out = await (await fetch("/api/voices")).json();
    } catch (e) {
      if (note) { note.textContent = "voice list unavailable — " + e.message;
                  note.className = "hint warn"; }
      return;
    }
    if (!ov.isConnected) return;          // closed while waiting
    const list = (out && out.voices) || [];
    const keep = sel.value || want;
    sel.innerHTML = list.map(v =>
      `<option ${keep === v ? "selected" : ""}>${v}</option>`).join("");
    if (!out.warming) { if (note) note.remove(); return; }
    if (note) note.textContent = "waking the speech engine…";
    await new Promise(r => setTimeout(r, 2000));
  }
  if (note) { note.textContent = "the speech engine did not answer — `ping-hub doctor`";
              note.className = "hint warn"; }
}

// Hotkey daemon + audio devices. Machine-gated: the endpoint answers
// available:false on anything without cx-ptt, and the whole section removes
// itself rather than rendering dead controls. Lazy, because the settings panel
// is not allowed to wait on anything again.
async function fillAudio(ov) {
  const host = ov.querySelector("#audiosec");
  if (!host) return;
  let out;
  try {
    out = await (await fetch("/api/audio")).json();
  } catch (e) { host.remove(); return; }
  if (!ov.isConnected) return;
  const dev = out.devices || {}, dae = out.daemon || {};
  if (!dev.available && !dae.launcher_present) { host.remove(); return; }

  const opts = (list, sel) => (list || []).map(d =>
    `<option value="${d.id}" ${d.default ? "selected" : ""}>${d.name}</option>`).join("");
  const stale = dev.stale
    ? `<div class="hint warn">device list last refreshed ${Math.round(dev.age || 0)}s ago —
       cx-ptt may not be running</div>` : "";
  host.innerHTML = `
    <h3>hotkey daemon &amp; audio (this machine)</h3>
    ${dev.available ? `${stale}
      <div class="srow"><label>speaker</label>
        <select id="a-spk">${opts(dev.playback)}</select></div>
      <div class="srow"><label>mic</label>
        <select id="a-mic">${opts(dev.recording)}</select></div>
      <div class="hint">changing the mic restarts the hotkey daemon — its input
        stream binds the default device once, when it opens.</div>`
      : `<div class="hint">no device list published — start cx-ptt to get one.</div>`}
    ${dae.launcher_present ? `<div class="repbtns">
        <button id="a-restart" class="repadd">${dae.running
          ? "restart hotkey daemon" : "start hotkey daemon"}</button></div>
      <div class="hint" id="a-msg">${dae.running
        ? "running as pid " + dae.pid : "not running"}</div>` : ""}`;

  const msg = (t, bad) => {
    const m = host.querySelector("#a-msg");
    if (m) { m.textContent = t; m.className = bad ? "hint warn" : "hint"; }
  };
  const btn = host.querySelector("#a-restart");
  if (btn) btn.onclick = async () => {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "working…";
    let r;
    try { r = await (await fetch("/api/cx-restart", { method: "POST",
      headers: {"Content-Type": "application/json"}, body: "{}" })).json(); }
    catch (e) { r = { ok: false, detail: e.message }; }
    btn.disabled = false; btn.textContent = label;
    msg(r.detail || (r.ok ? "done" : "failed"), !r.ok);
  };

  const switchTo = async (sel, kind) => {
    const id = sel.value;
    if (!id) return;
    sel.disabled = true;
    // say it BEFORE it happens: a hotkey daemon vanishing mid-dictation with
    // no warning reads as a crash
    msg(kind === "mic" ? "switching mic and restarting the hotkey daemon…"
                       : "switching speaker…");
    let r;
    try { r = await (await fetch("/api/audio", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id, kind }) })).json(); }
    catch (e) { r = { ok: false, detail: e.message }; }
    sel.disabled = false;
    if (!r.ok) { msg(r.detail || "the switch failed", true); return; }
    msg(kind === "mic"
      ? "mic switched; hotkey daemon " + ((r.restart || {}).ok ? "restarted"
          : "NOT restarted — " + ((r.restart || {}).detail || "unknown"))
      : "speaker switched");
  };
  const spk = host.querySelector("#a-spk"), mic = host.querySelector("#a-mic");
  if (spk) spk.onchange = () => switchTo(spk, "speaker");
  if (mic) mic.onchange = () => switchTo(mic, "mic");
}

// ── resizable sidebar (width persists) ────────────────────────────────────
const sideEl = document.getElementById("side");
const saved = localStorage.getItem("hub-side-width");
if (saved) sideEl.style.width = saved + "px";
const divider = document.getElementById("divider");
divider.addEventListener("mousedown", e => {
  e.preventDefault();
  divider.classList.add("dragging");
  const move = ev => {
    const w = Math.min(640, Math.max(220, ev.clientX));
    sideEl.style.width = w + "px";
  };
  const up = () => {
    divider.classList.remove("dragging");
    localStorage.setItem("hub-side-width", parseInt(sideEl.style.width));
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

loadRoster();
refreshEscBadge();
setInterval(loadRoster, 5000);
setInterval(refreshEscBadge, 10000);
</script>
</body>
